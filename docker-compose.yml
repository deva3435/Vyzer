services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vyzer
      POSTGRES_USER: vyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - vyzer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyzer -d vyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://vyzer:${POSTGRES_PASSWORD}@postgres:5432/vyzer
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
      PORT: 8000
    command: ["sh", "-c", "python scripts/upgrade_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AUTO_VERIFY_CODE: ${AUTO_VERIFY_CODE:-true}
      VYZER_GENERAL_MODEL: ${VYZER_GENERAL_MODEL:-}
      VYZER_CODER_MODEL: ${VYZER_CODER_MODEL:-}
      VYZER_REASONING_MODEL: ${VYZER_REASONING_MODEL:-}
      VYZER_VISION_MODEL: ${VYZER_VISION_MODEL:-}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  vyzer_postgres:
